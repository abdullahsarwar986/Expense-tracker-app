<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="expense-tracker-app.css">
</head>
<body>

    <main class="container">
        <h2>Expense Tracker</h2>
        
      
        <div class="balance-container">
            <h4>Total Balance</h4>
            <h1 id="balance">$0.00</h1>
        </div>

      
        <form id="expense-form">
            <div class="form-group">
                <label for="text">Expense Name</label>
                <input type="text" id="text" placeholder="Enter description..." required />
            </div>
            <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" placeholder="Enter amount..." step="0.01" required />
            </div>
            <button class="btn">Add Expense</button>
        </form>

        
        <h3>History</h3>
        <ul id="list" class="list">
          
        </ul>
    </main>

    <script src="expense-tracker-app.js"></script>
</body>
</html>
